# Monitoring stack for Kubernetes (kube-prometheus-stack).
#
# Prerequisites: install kube-prometheus-stack (Prometheus Operator) into the
# cluster, e.g.:
#
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace
#
# Then apply this file (and the PrometheusRule in monitoring-prometheusrule.yaml):
#
#   kubectl apply -f k8s/monitoring-servicemonitors.yaml
#   kubectl apply -f k8s/monitoring-prometheusrule.yaml
#
# The ServiceMonitors below replace the static docker-compose scrape targets in
# monitoring/prometheus.yml by letting the Prometheus Operator discover the
# backend and frontend Services via label selectors.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: backend
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frontend
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: frontend
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
