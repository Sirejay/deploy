# ---------------------------------------------------------------------------
# ExternalSecret example for the backend-secret Secret.
#
# This manifest is an EXAMPLE ONLY and is intentionally NOT listed in
# k8s/kustomization.yaml, so `kubectl apply -k k8s/` never applies it.
#
# It requires the External Secrets Operator to be installed in the cluster
# (see docs/DEPLOY-KUBERNETES.md for setup steps). The operator syncs the
# referenced remote secret into the `backend-secret` Secret consumed by the
# backend deployment. The keys below match k8s/secrets.yaml.
#
# Adjust `secretStoreRef`, `remoteRef.key`, and the property names to match
# your secret backend (Vault, AWS Secrets Manager, GCP Secret Manager, etc.).
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secret
  namespace: synapsvault
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: secrets
spec:
  # How often the operator re-syncs values from the remote store.
  refreshInterval: 1h
  secretStoreRef:
    # Must reference an existing SecretStore/ClusterSecretStore.
    name: backend-secret-store
    kind: SecretStore
  target:
    # Sync into the same Secret the backend deployment consumes.
    name: backend-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: synapsvault/backend
        property: DATABASE_URL
    - secretKey: SUPABASE_SERVICE_KEY
      remoteRef:
        key: synapsvault/backend
        property: SUPABASE_SERVICE_KEY
    - secretKey: AGENT_SECRET_KEY
      remoteRef:
        key: synapsvault/backend
        property: AGENT_SECRET_KEY
    - secretKey: REGISTRY_SECRET_KEY
      remoteRef:
        key: synapsvault/backend
        property: REGISTRY_SECRET_KEY
    - secretKey: STELLAR_SECRET_KEY
      remoteRef:
        key: synapsvault/backend
        property: STELLAR_SECRET_KEY
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: synapsvault/backend
        property: OPENROUTER_API_KEY
    - secretKey: ADMIN_API_KEY
      remoteRef:
        key: synapsvault/backend
        property: ADMIN_API_KEY
