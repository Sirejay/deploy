apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: backend
    component: backend
data:
  NODE_ENV: "production"
  PORT: "3000"
  STELLAR_NETWORK: "testnet"
  SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org"
  STELLAR_HORIZON_URL: "https://horizon-testnet.stellar.org"
  USDC_CONTRACT_ID: "CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA"
  FACILITATOR_URL: "http://backend:3000"
  # Comma-separated browser origins allowed by CORS; set to your public host.
  ALLOWED_ORIGINS: "https://app.example.com"
  # Connection pooling for the HPA-scaled backend.
  # Route DATABASE_URL through Supabase's pooler (port 6543) or a PgBouncer
  # service so replicas share a bounded set of Postgres connections.
  # Example: postgres://user:pass@db.<project>.supabase.co:6543/postgres
  # Keep DB_POOL_SIZE small so (maxReplicas * DB_POOL_SIZE) stays within the
  # Postgres/Supabase connection limit. With 10 replicas and a 60-connection
  # budget, 5 per replica leaves headroom for migrations and admin sessions.
  DB_POOL_SIZE: "5"
  DB_POOL_TIMEOUT_MS: "10000"
