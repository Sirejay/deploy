apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-runtime-config
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: runtime-config
data:
  # Runtime configuration consumed by the frontend container at start.
  # The entrypoint renders these into /config.js as window.__APP_CONFIG__,
  # so a single image can be promoted across environments.
  VITE_API_BASE_URL: "https://api.example.com"
  VITE_APP_ENV: "production"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: config
data:
  # Non-secret backend configuration. Names match what the backend reads
  # (see .env.example and docs/ENVIRONMENT-VARIABLES.md).
  SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org"
  STELLAR_NETWORK: "testnet"
  STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
  STELLAR_HORIZON_URL: "https://horizon-testnet.stellar.org"
  # Contract IDs below are updated automatically by the deploy-contracts
  # workflow (optional ConfigMap PR step) after a successful deploy.
  USDC_CONTRACT_ID: "CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA"
  AGENT_CONTRACT_ID: ""
  REGISTRY_CONTRACT_ID: ""
  OPENROUTER_MODEL: "anthropic/claude-3.5-sonnet"
  SUPABASE_URL: "https://your-project.supabase.co"
  LOG_LEVEL: "info"
  FACILITATOR_URL: "http://backend:3000"
  # Comma-separated browser origins allowed by CORS. The placeholder below is
  # replaced at deploy time from vars.DEPLOY_HOST via the kustomize
  # replacements in k8s/kustomization.yaml (see also k8s/ingress.yaml).
  ALLOWED_ORIGINS: "https://DEPLOY_HOST"
---
# Base defaults only. Environment-specific values (network, RPC/Horizon URLs,
# USDC contract, ALLOWED_ORIGINS) are overridden per overlay via
# kustomize patches in k8s/overlays/{staging,production}.
#
# ALLOWED_ORIGINS is parameterised: the DEPLOY_HOST token is substituted with
# the deploy host (vars.DEPLOY_HOST) by the kustomize replacements wired in
# k8s/kustomization.yaml, so host, TLS secret and CORS origin all derive from
# a single value.
  # Comma-separated browser origins allowed by CORS; set to your public host.
  ALLOWED_ORIGINS: "https://app.example.com"
  # Contract IDs deployed to the network above. These are managed in Git so
  # `kubectl apply` and the running config stay in sync. Replace the
  # placeholders with the IDs emitted by the contract deploy, then re-apply:
  #   kubectl apply -f k8s/configmap.yaml
  #   kubectl rollout restart deployment/backend
  # (or use `scripts/rollback-contracts.cjs --configmap` to patch them).
  ESCROW_CONTRACT_ID: ""
  PAYMENT_CONTRACT_ID: ""
  REGISTRY_CONTRACT_ID: ""
