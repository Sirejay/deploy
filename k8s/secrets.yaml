apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: default
type: Opaque
stringData:
  # Connection pooling for the HPA-scaled backend (up to 10 replicas).
  #
  # Each replica opens its own pool, so total connections = replicas * pool size.
  # Keep this within your Postgres/Supabase connection limit.
  #
  # Preferred: use Supabase's built-in pooler (PgBouncer) on port 6543 instead of
  # the direct connection on port 5432. The pooler multiplexes many client
  # connections onto a small number of real Postgres connections.
  #
  #   Direct:  postgresql://postgres:<password>@db.<project-ref>.supabase.co:5432/postgres
  #   Pooler:  postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres
  #
  # When using the pooler, keep the per-replica pool small (e.g. 5) so that
  # 10 replicas * 5 = 50 client connections stay well within the pooler limit.
  #
  # If you self-host PgBouncer instead, point DATABASE_URL at the PgBouncer
  # service (e.g. pgbouncer:6432) and size the per-replica pool accordingly.
  DATABASE_URL: "postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres"
  # Per-replica connection pool size. Total = replicas * DB_POOL_SIZE.
  DB_POOL_SIZE: "5"
