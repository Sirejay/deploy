name: Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

env:
  # Aligned with the Postgres major version used for local dev (docker-compose.yml)
  # and production/Supabase. Keep all three on the same major so dumps taken
  # here restore cleanly into local dev. See docs/BACKUP-RESTORE.md.
  PG_CLIENT_VERSION: '17'

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # stable
      - name: Run backup script
        if: steps.config.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_ENCRYPTION_METHOD: gpg
          BACKUP_STORAGE_BUCKET: ${{ secrets.BACKUP_STORAGE_BUCKET }}
          BACKUP_STORAGE_REGION: ${{ secrets.BACKUP_STORAGE_REGION || 'us-east-1' }}
          BACKUP_STORAGE_ACCESS_KEY_ID: ${{ secrets.BACKUP_STORAGE_ACCESS_KEY_ID }}
          BACKUP_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_STORAGE_SECRET_ACCESS_KEY }}
          BACKUP_STORAGE_ENDPOINT: ${{ secrets.BACKUP_STORAGE_ENDPOINT }}
          SOROBAN_RPC_URL: ${{ vars.SOROBAN_RPC_URL }}
          SOROBAN_NETWORK_PASSPHRASE: ${{ vars.SOROBAN_NETWORK_PASSPHRASE }}
          SOROBAN_CONTRACT_IDS: ${{ vars.SOROBAN_CONTRACT_IDS }}
          PROM_PUSHGATEWAY_URL: ${{ secrets.PROM_PUSHGATEWAY_URL }}
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '30' }}
          BACKUP_OUTPUT_DIR: backups
          GIT_COMMIT: ${{ github.sha }}
          ENVIRONMENT: production
        run: bash scripts/backup.sh

      - name: Upload backup manifest and metrics
        if: always() && steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backup-manifest-${{ github.run_id }}
          path: |
            backups/*.json
            backups/*.prom
          if-no-files-found: warn
          retention-days: 30

  verify-restore:
    name: Verify Restore (Staging)
    # With job=both, run after the backup so it verifies the fresh archive.
    # always() keeps this job from being skipped when `backup` was skipped.
    needs: [backup]
    if: >-
      always() && (
        (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0') ||
        (github.event_name == 'workflow_dispatch' && inputs.job != 'backup')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2 # v2

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4 # v4

      - name: Run backup
        run: ./scripts/backup.sh
      - name: Run restore verification
        if: steps.config.outputs.ready == 'true'
        env:
          # The staging role needs CREATEDB: verification restores into a
          # throwaway database that is dropped afterwards.
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_STORAGE_BUCKET: ${{ secrets.BACKUP_STORAGE_BUCKET }}
          BACKUP_STORAGE_REGION: ${{ secrets.BACKUP_STORAGE_REGION || 'us-east-1' }}
          BACKUP_STORAGE_ACCESS_KEY_ID: ${{ secrets.BACKUP_STORAGE_ACCESS_KEY_ID }}
          BACKUP_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_STORAGE_SECRET_ACCESS_KEY }}
          BACKUP_STORAGE_ENDPOINT: ${{ secrets.BACKUP_STORAGE_ENDPOINT }}
        run: bash scripts/restore.sh --verify-only

  notify-failure:
    name: Notify on Backup or Restore Failure
    needs: [backup, verify-restore]
    if: >-
      always() && (
        needs.backup.result == 'failure' ||
        needs.verify-restore.result == 'failure'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Send failure alert
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          BACKUP_RESULT: ${{ needs.backup.result }}
          VERIFY_RESULT: ${{ needs.verify-restore.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          msg="SynapsVault Database Backup workflow failed (backup=${BACKUP_RESULT}, verify-restore=${VERIFY_RESULT}): ${RUN_URL}"
          echo "::error::${msg}"
          if [[ -n "${ALERT_WEBHOOK_URL}" ]]; then
            payload="$(printf '{"text":"%s"}' "${msg}")"
            curl -fsS -X POST -H 'Content-Type: application/json' --data "${payload}" "${ALERT_WEBHOOK_URL}"
          else
            echo "::warning::ALERT_WEBHOOK_URL secret is not set; failure logged to workflow summary only."
          fi
          echo "### :x: Backup / Restore Verification Failure" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Backup job**: \`${BACKUP_RESULT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Verify-restore job**: \`${VERIFY_RESULT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run URL**: ${RUN_URL}" >> "$GITHUB_STEP_SUMMARY"
