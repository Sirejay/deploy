name: Deploy Contracts

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Stellar network to deploy to'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet
          - mainnet
      update_configmap:
        description: 'Open a PR updating the K8s ConfigMap with the new contract IDs'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    name: Deploy contracts
    runs-on: ubuntu-latest
    outputs:
      contract_ids: ${{ steps.ids.outputs.contract_ids }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build contracts
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Deploy contracts
        id: deploy
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
          NETWORK: ${{ inputs.network }}
        run: ./scripts/deploy-contracts.sh

      - name: Collect contract IDs
        id: ids
        run: |
          if [ -f contract-ids.json ]; then
            echo "contract_ids=$(jq -c . contract-ids.json)" >> "$GITHUB_OUTPUT"
          else
            echo "contract_ids={}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload contract IDs artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-ids-${{ inputs.network }}
          path: contract-ids.json
          if-no-files-found: warn

  update-configmap:
    name: Open ConfigMap update PR
    needs: deploy
    if: ${{ inputs.update_configmap }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update ConfigMap with new contract IDs
        env:
          CONTRACT_IDS: ${{ needs.deploy.outputs.contract_ids }}
          NETWORK: ${{ inputs.network }}
        run: |
          set -euo pipefail
          if [ -z "${CONTRACT_IDS:-}" ] || [ "$CONTRACT_IDS" = "{}" ]; then
            echo "No contract IDs produced; nothing to update."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, re

          ids = json.loads(os.environ["CONTRACT_IDS"])
          path = "k8s/configmap.yaml"
          with open(path) as f:
              text = f.read()

          for key, value in ids.items():
              # Map contract name -> ConfigMap key, e.g. "vault" -> "VAULT_CONTRACT_ID".
              cm_key = re.sub(r"[^A-Za-z0-9]+", "_", key).upper() + "_CONTRACT_ID"
              pattern = re.compile(rf"^(\s*{re.escape(cm_key)}:\s*).*$", re.MULTILINE)
              if pattern.search(text):
                  text = pattern.sub(lambda m: m.group(1) + f'"{value}"', text)
              else:
                  text = text.rstrip("\n") + f'\n  {cm_key}: "{value}"\n'

          with open(path, "w") as f:
              f.write(text)
          PY

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: update contract IDs in K8s ConfigMap (${{ inputs.network }})'
          title: 'chore: update contract IDs in K8s ConfigMap (${{ inputs.network }})'
          body: |
            Automated update of `k8s/configmap.yaml` with the contract IDs
            produced by the `deploy-contracts.yml` workflow run for
            `${{ inputs.network }}`.

            Contract IDs: `${{ needs.deploy.outputs.contract_ids }}`
          branch: chore/update-contract-ids-${{ inputs.network }}
          delete-branch: true
          add-paths: |
            k8s/configmap.yaml
