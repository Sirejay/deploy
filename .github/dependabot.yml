version: 2
updates:
  # npm dependencies (grouped minor/patch updates)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker images referenced in Dockerfiles (grouped minor/patch updates)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Compose images (postgres, prometheus, grafana, alertmanager,
  # postgres-exporter) pinned in docker-compose.yml (grouped minor/patch)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-compose-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
