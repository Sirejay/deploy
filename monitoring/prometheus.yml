global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: 'synapsvault-monitor'
    # Defaults to 'local' for docker-compose; production deployments set
    # PROMETHEUS_ENVIRONMENT=production (Prometheus expands ${VAR} here).
    environment: '${PROMETHEUS_ENVIRONMENT:-local}'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Mounted at this path by docker-compose.yml.
rule_files:
  - '/etc/prometheus/alert-rules.yml'

# Job names matter: monitoring/alert-rules.yml selects on job="backend" and
# job="database".
scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          tier: 'monitoring'

  - job_name: 'backend'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['backend:3000']
        labels:
          service: 'synapsvault-backend'
          tier: 'application'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(?::\d+)?'
        replacement: '${1}'

  - job_name: 'database'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'synapsvault-database'
          tier: 'data'

  # Blackbox probes for the public frontend URL: HTTP availability and TLS
  # certificate expiry. alert-rules.yml selects on job="blackbox_http" and
  # job="blackbox_tls".
  - job_name: 'blackbox_http'
    metrics_path: '/probe'
    params:
      module: ['http_2xx']
    static_configs:
      - targets: ['https://synapsvault.example.com']
        labels:
          service: 'synapsvault-frontend'
          tier: 'application'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox-exporter:9115'

  - job_name: 'blackbox_tls'
    metrics_path: '/probe'
    params:
      module: ['http_2xx']
    static_configs:
      - targets: ['https://synapsvault.example.com']
        labels:
          service: 'synapsvault-frontend'
          tier: 'application'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox-exporter:9115'

  # kube-state-metrics powers the pod restart / CrashLoopBackOff alerts.
  - job_name: 'kube-state-metrics'
    scrape_interval: 30s
    static_configs:
      - targets: ['kube-state-metrics:8080']
        labels:
          service: 'kube-state-metrics'
          tier: 'infrastructure'

  # Backup metrics (soroban_backup_*) are written by scripts/backup.sh to a
  # node_exporter textfile collector. Uncomment when backups run on a host with
  # node_exporter; the GitHub Actions backup job has no exporter to scrape.
  # - job_name: 'backup'
  #   scrape_interval: 60s
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #       labels:
  #         service: 'backup'
  #         tier: 'infrastructure'
